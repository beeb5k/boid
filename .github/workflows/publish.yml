name: Build and publish Noctalia

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noctalia-xbps-repository
  cancel-in-progress: false

env:
  XBPS_ARCH: x86_64

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    permissions:
      contents: read

    outputs:
      publish: ${{ steps.release.outputs.publish }}
      version: ${{ steps.release.outputs.version }}
      checksum: ${{ steps.release.outputs.checksum }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check upstream release and publication state
        id: release
        shell: bash
        run: |
          set -euo pipefail

          state_file=".github/noctalia-last-success.env"

          tag="$(
            curl -fsSL --retry 3 \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/noctalia-dev/noctalia/releases/latest |
              jq -er '.tag_name'
          )"

          case "$tag" in
            v*) version="${tag#v}" ;;
            *)
              echo "Unexpected upstream release tag: $tag" >&2
              exit 1
              ;;
          esac

          archive="$RUNNER_TEMP/noctalia-${tag}.tar.gz"
          curl -fL --retry 3 \
            "https://github.com/noctalia-dev/noctalia/archive/refs/tags/${tag}.tar.gz" \
            -o "$archive"

          checksum="$(sha256sum "$archive" | awk '{print $1}')"

          published_version=""
          published_checksum=""
          if [[ -f "$state_file" ]]; then
            # shellcheck disable=SC1090
            source "$state_file"
            published_version="${NOCTALIA_PUBLISHED_VERSION:-}"
            published_checksum="${NOCTALIA_PUBLISHED_CHECKSUM:-}"
          fi

          publish=true
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]] &&
             [[ "$published_version" == "$version" ]] &&
             [[ "$published_checksum" == "$checksum" ]]; then
            publish=false
          fi

          echo "Latest upstream tag: $tag"
          echo "Latest upstream version: $version"
          if [[ -n "$published_version" ]]; then
            echo "Last successful publication: ${published_version} (${published_checksum})"
          else
            echo "No prior successful publication state found."
          fi
          echo "publish=$publish"

          {
            echo "publish=$publish"
            echo "tag=$tag"
            echo "version=$version"
            echo "checksum=$checksum"
          } >> "$GITHUB_OUTPUT"

      - name: Build, validate, and sign Noctalia repository in Void container
        if: steps.release.outputs.publish == 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_CHECKSUM: ${{ steps.release.outputs.checksum }}
          XBPS_PRIVATE_KEY_B64: ${{ secrets.XBPS_PRIVATE_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${XBPS_PRIVATE_KEY_B64:-}" ]]; then
            echo "Missing required secret XBPS_PRIVATE_KEY_B64." >&2
            exit 1
          fi

          repo_root="$GITHUB_WORKSPACE"
          scratch="$RUNNER_TEMP/noctalia-build"
          outdir="$repo_root/public"

          rm -rf "$scratch" "$outdir"
          mkdir -p "$scratch" "$outdir/repo"

          cp "$repo_root/srcpkgs/noctalia/template" "$scratch/template"
          sed -i \
            -e "s/^version=.*/version=${RELEASE_VERSION}/" \
            -e "s/^checksum=.*/checksum=\"${RELEASE_CHECKSUM}\"/" \
            "$scratch/template"

          docker run --rm \
            -e RELEASE_VERSION="$RELEASE_VERSION" \
            -e RELEASE_TAG="$RELEASE_TAG" \
            -e RELEASE_CHECKSUM="$RELEASE_CHECKSUM" \
            -e XBPS_PRIVATE_KEY_B64="$XBPS_PRIVATE_KEY_B64" \
            -v "$repo_root:/workspace" \
            -v "$scratch:/scratch" \
            --workdir /scratch \
            voidlinux/voidlinux:latest \
            /bin/sh -euxc '
              xbps-install -Suy
              xbps-install -Sy xbps git curl jq openssl base-chroot findutils sed grep coreutils tar xz

              git clone --depth=1 https://github.com/void-linux/void-packages.git /scratch/void-packages
              cp /scratch/template /scratch/void-packages/srcpkgs/noctalia/template

              printf "%s\n" \
                "XBPS_CHROOT_CMD=ethereal" \
                "XBPS_ALLOW_CHROOT_BREAKOUT=yes" \
                > /scratch/void-packages/etc/conf

              rm -rf /scratch/void-packages/masterdir
              ln -s / /scratch/void-packages/masterdir

              cd /scratch/void-packages
              ./xbps-src -A x86_64 pkg noctalia

              pkg="$(find /scratch/void-packages/hostdir/binpkgs -maxdepth 1 -type f -name "noctalia-${RELEASE_VERSION}_*.x86_64.xbps" -print -quit)"
              [ -n "$pkg" ]

              install -m 0644 "$pkg" /workspace/public/repo/

              key="/scratch/private.pem"
              umask 077
              printf "%s" "$XBPS_PRIVATE_KEY_B64" | base64 -d > "$key"
              openssl pkey -in "$key" -check -noout >/dev/null

              xbps-rindex -a /workspace/public/repo/*.xbps
              xbps-rindex --privkey "$key" --sign-pkg /workspace/public/repo/*.xbps
              xbps-rindex -a /workspace/public/repo/*.xbps
              xbps-rindex --privkey "$key" --sign --signedby "Noctalia XBPS Repository" /workspace/public/repo

              xbps-rindex -c /workspace/public/repo
              xbps-query --repository /workspace/public/repo -Rs "^noctalia$" | grep -q "noctalia-${RELEASE_VERSION}_1"

              xbps-query -c /workspace/public/repo/noctalia-${RELEASE_VERSION}_1.x86_64.xbps | grep -q "pkgver: noctalia-${RELEASE_VERSION}_1"
              xbps-query -c /workspace/public/repo/noctalia-${RELEASE_VERSION}_1.x86_64.xbps | grep -q "architecture: x86_64"
              xbps-query -c /workspace/public/repo/noctalia-${RELEASE_VERSION}_1.x86_64.xbps | grep -q "short_desc: A sleek, customizable desktop shell crafted for Wayland"

              xbps-query -c /workspace/public/repo/noctalia-${RELEASE_VERSION}_1.x86_64.xbps -f | grep -q "/usr/bin/noctalia"
              xbps-query -c /workspace/public/repo/noctalia-${RELEASE_VERSION}_1.x86_64.xbps -f | grep -Eq "/usr/share/applications/.*\.desktop"
              xbps-query -c /workspace/public/repo/noctalia-${RELEASE_VERSION}_1.x86_64.xbps -f | grep -Eq "/usr/share/icons/"

              pubkey="/scratch/noctalia-repo.pub"
              openssl pkey -in "$key" -pubout > "$pubkey"

              rootdir="/scratch/install-root"
              mkdir -p "$rootdir/var/db/xbps/keys"
              cp -a /var/db/xbps/keys/. "$rootdir/var/db/xbps/keys/"
              install -m 0644 "$pubkey" "$rootdir/var/db/xbps/keys/noctalia-repo.plist"

              xbps-install -Suy
              xbps-install -Sy -y \
                --rootdir "$rootdir" \
                --repository https://repo-default.voidlinux.org/current \
                --repository /workspace/public/repo \
                noctalia

              xbps-query --rootdir "$rootdir" noctalia | grep -q "noctalia-${RELEASE_VERSION}_1"

              rm -f "$key"
            '

          find "$outdir/repo" -mindepth 1 -maxdepth 1 -type f ! -name "noctalia-${RELEASE_VERSION}_1.x86_64.xbps" ! -name "x86_64-repodata" ! -name "x86_64-repodata.sig2" -delete

          if [[ ! -f "$outdir/repo/noctalia-${RELEASE_VERSION}_1.x86_64.xbps" ]]; then
            echo "Expected package not found in repository output." >&2
            exit 1
          fi

          if [[ ! -f "$outdir/repo/x86_64-repodata" || ! -f "$outdir/repo/x86_64-repodata.sig2" ]]; then
            echo "Repository index/signature are missing." >&2
            exit 1
          fi

          printf '%s\n' \
            '<!doctype html>' \
            '<html lang="en">' \
            '<head><meta charset="utf-8"><title>Noctalia XBPS Repository</title></head>' \
            '<body><p>Noctalia XBPS repository: <a href="/boid/repo/">/boid/repo/</a></p></body>' \
            '</html>' \
            > "$outdir/index.html"

          printf '%s\n' \
            '<!doctype html>' \
            '<html lang="en">' \
            '<head><meta charset="utf-8"><title>Noctalia XBPS Repo Content</title></head>' \
            '<body><p>Repository metadata and current Noctalia package are published in this directory.</p></body>' \
            '</html>' \
            > "$outdir/repo/index.html"

          touch "$outdir/.nojekyll"

      - name: Configure Pages
        if: steps.release.outputs.publish == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.release.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  record-success:
    needs: [build, deploy]
    if: needs.build.outputs.publish == 'true' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Record successful publication
        env:
          VERSION: ${{ needs.build.outputs.version }}
          CHECKSUM: ${{ needs.build.outputs.checksum }}
        shell: bash
        run: |
          set -euo pipefail

          git pull --ff-only origin main

          sed -i \
            -e "s/^version=.*/version=${VERSION}/" \
            -e "s/^checksum=.*/checksum=\"${CHECKSUM}\"/" \
            srcpkgs/noctalia/template

          printf "%s\n" \
            "NOCTALIA_PUBLISHED_VERSION=${VERSION}" \
            "NOCTALIA_PUBLISHED_CHECKSUM=${CHECKSUM}" \
            > .github/noctalia-last-success.env

          if git diff --quiet -- srcpkgs/noctalia/template .github/noctalia-last-success.env; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add srcpkgs/noctalia/template .github/noctalia-last-success.env
          git commit -m "Publish Noctalia ${VERSION}"
          git push origin HEAD:main
